*{box-sizing:border-box}
body{margin:0;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 color:#1a1a1a;background:#fafafa;padding:32px 20px 64px}
header{max-width:1200px;margin:0 auto 28px}
h1{font-size:22px;font-weight:600;margin:0 0 4px}
.sub{color:#777;font-size:14px}
#f{display:block;width:100%;max-width:1200px;margin:18px auto 0;padding:11px 14px;
 border:1px solid #ddd;border-radius:9px;font-size:15px}
.grid{max-width:1200px;margin:22px auto 0;display:grid;gap:22px;
 grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
figure{margin:0}
.zone{position:relative;aspect-ratio:1;background:#fff;border:1px solid #e3e3e3;border-radius:12px;
 display:flex;align-items:center;justify-content:center;padding:0;overflow:hidden;
 box-shadow:0 1px 2px rgba(0,0,0,.04)}
.zone::after{content:"40 × 40 cm";position:absolute;left:10px;bottom:8px;font-size:10px;
 letter-spacing:.05em;color:#bbb}
.zone img{max-width:100%;max-height:100%;object-fit:contain}
.wait{color:#bbb;font-size:13px}
figcaption{margin-top:10px;text-align:center;font-size:14px;font-weight:500;color:#333}
footer{max-width:1200px;margin:48px auto 0;color:#aaa;font-size:12px;text-align:center}
@media(prefers-color-scheme:dark){
 body{background:#131314;color:#eee} .zone{background:#1c1c1e;border-color:#333}
 figcaption{color:#ddd} #f{background:#1c1c1e;border-color:#333;color:#eee}
}
